<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css" id="hljsTheme">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-brand">
                <i class="fas fa-robot"></i>
                <span>AI Agent</span>
            </div>
            <button class="btn-icon" id="toggleSidebar" title="Toggle sidebar">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <div class="sidebar-search">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search chats..." id="searchInput">
        </div>

        <nav class="sidebar-nav">
            <div class="nav-item active" data-nav="home"><i class="fas fa-home"></i><span>Home</span></div>
            <div class="nav-item" data-nav="favorites"><i class="fas fa-star"></i><span>Favorites</span></div>
            <div class="nav-item" data-nav="recent"><i class="fas fa-clock"></i><span>Recent</span></div>
        </nav>

        <div class="sidebar-section">
            <div class="sidebar-section-header">
                <span>Chats</span>
                <button class="btn-icon btn-icon-sm" id="newChat" title="New chat">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div class="manage-bar" id="manageBar" style="display:none;">
                <button type="button" id="selectAllBtn" class="btn-text">Select all</button>
                <button type="button" id="deleteSelectedBtn" class="btn-text danger">Delete (<span id="selectedCount">0</span>)</button>
            </div>
            <div class="conversation-list" id="conversationList"></div>
        </div>

        <div class="sidebar-footer">
            <button class="btn-icon" id="themeToggle" title="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
            <button class="btn-icon" id="settingsBtn" title="Settings">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </aside>

    <!-- ===== Main Chat ===== -->
    <main class="main-content">

        <!-- Header -->
        <header class="chat-header">
            <button class="btn-icon mobile-menu" id="mobileMenu"><i class="fas fa-bars"></i></button>
            <h1 class="chat-title" id="chatTitle">New Chat</h1>
            <div class="header-actions">
                <button class="btn-icon" id="clearChatBtn" title="Clear chat"><i class="fas fa-eraser"></i></button>
            </div>
        </header>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
            <div class="empty-heading">
                <i class="fas fa-robot empty-icon"></i>
                <h2>AI Agent</h2>
            </div>
            <p>What can I help you with?</p>
            <div class="prompt-grid">
                <button class="prompt-card" data-prompt="Explain quantum computing in simple terms">
                    <i class="fas fa-atom"></i>
                    <span>Explain quantum computing</span>
                </button>
                <button class="prompt-card" data-prompt="Write a Python web scraper">
                    <i class="fas fa-code"></i>
                    <span>Python scraper</span>
                </button>
                <button class="prompt-card" data-prompt="Summarize today's top news">
                    <i class="fas fa-newspaper"></i>
                    <span>News summary</span>
                </button>
                <button class="prompt-card" data-prompt="Build a REST API with Flask">
                    <i class="fas fa-server"></i>
                    <span>REST API</span>
                </button>
                <button class="prompt-card" data-prompt="Debug this code: def divide(a,b): return a/b">
                    <i class="fas fa-bug"></i>
                    <span>Debug code</span>
                </button>
                <button class="prompt-card" data-prompt="Design a dark-themed dashboard UI">
                    <i class="fas fa-palette"></i>
                    <span>Design UI</span>
                </button>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-container" id="chatContainer" style="display:none;">
            <div class="messages" id="messages"></div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="attachment-bar" id="attachmentBar" style="display:none;"></div>
            <div class="input-wrapper">
                <button class="btn-icon" id="addButton" title="Add attachment"><i class="fas fa-plus"></i></button>
                <textarea id="messageInput" placeholder="Message AI Agent..." rows="1"></textarea>
                <div class="input-actions">
                    <button class="btn-icon" id="voiceInput" title="Voice input"><i class="fas fa-microphone"></i></button>
                    <button class="btn-icon" id="imageInput" title="Attach image"><i class="fas fa-image"></i></button>
                    <button class="btn-primary" id="sendButton" title="Send"><i class="fas fa-arrow-up"></i></button>
                    <button class="btn-primary btn-stop" id="stopButton" title="Stop generating" style="display:none;"><i class="fas fa-stop"></i></button>
                </div>
            </div>
            <div class="input-footer">
                <select id="modeSelect" class="mode-select">
                    <option value="claude-code">Claude Code</option>
                    <option value="codex">Codex</option>
                    <option value="coder">Coder</option>
                    <option value="coding">Coding</option>
                    <option value="architect">Architect</option>
                    <option value="reviewer">Reviewer</option>
                    <option value="debugger">Debugger</option>
                    <option value="security">Security</option>
                    <option value="visualization">Visualization</option>
                    <option value="unrestricted">Unrestricted</option>
                </select>
                <span class="input-hint">Shift+Enter newline · Enter send</span>
            </div>
        </div>
    </main>

    <!-- ===== Settings Modal ===== -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="btn-icon" id="closeModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>Routing Mode</label>
                    <select id="routingModeSelect">
                        <option value="single">Single model</option>
                        <option value="hybrid">Hybrid (fast + reasoning)</option>
                    </select>
                </div>
                <div class="setting-group" id="singleModelGroup">
                    <label>Model</label>
                    <select id="modelSelect"></select>
                </div>
                <div class="setting-group" id="hybridModelGroup" style="display:none;">
                    <label>Fast Model (simple tasks)</label>
                    <select id="fastModelSelect"></select>
                    <label>Reasoning Model (complex tasks)</label>
                    <select id="reasoningModelSelect"></select>
                </div>
                <div class="setting-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="autonomousCheckbox" checked>
                        <span>Enable autonomous mode</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelSettings">Cancel</button>
                <button class="btn-primary" id="saveSettings">Save</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
